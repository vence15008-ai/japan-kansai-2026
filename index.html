    const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    document.getElementById('gate').addEventListener('submit',async event=>{
      event.preventDefault();
      const code=document.getElementById('code').value;
      const button=document.getElementById('submit');
      const status=document.getElementById('status');
      status.textContent='';button.disabled=true;button.textContent='正在验证…';
      try{
        const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
        const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv)},key,from64(payload.data));
        const page=new TextDecoder().decode(clear);
        document.open();document.write(page);document.close();
      }catch(error){
        status.textContent='访问码不正确，请重试。';
        button.disabled=false;button.textContent='打开旅行规划';
        document.getElementById('code').select();
