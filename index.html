    const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const storageKey='japan-kansai-2026-access-code';
    const unlock=async(code,persist)=>{
      const button=document.getElementById('submit');
      const status=document.getElementById('status');
      status.textContent='';button.disabled=true;button.textContent='正在验证…';
      try{
        const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);

        localStorage.removeItem(storageKey);
        status.textContent='访问码不正确，请重试。';
        button.disabled=false;button.textContent='打开旅行规划';
