const switcherHtml = "<style>#travel-project-switch{position:fixed;z-index:9999;right:16px;bottom:16px;padding:11px 13px;border:1px solid #d9ddeb;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 12px 34px rgba(18,31,52,.16);font:13px/1.45 system-ui,-apple-system,\"PingFang SC\",sans-serif;color:#17243a}#travel-project-switch a{color:#176b62;font-weight:800;text-decoration:underline;text-underline-offset:3px}</style><aside id=\"travel-project-switch\"><a href=\"?switch=1\" aria-label=\"切换行程码\">切换行程码</a></aside>";
const defaultAccessCode = "666";
const lastProjectKey = "travel-last-project";
const codeKey = (id) => "travel-access-code:" + id;
const from64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
async function decrypt(project, code) {
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: from64(project.payload.salt), iterations: project.payload.iterations, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: from64(project.payload.iv) }, key, from64(project.payload.data)));
}
async function openProject(code, persist) {
  const button = document.getElementById("submit");
  const status = document.getElementById("status");
  status.textContent = "";
  button.disabled = true;
  button.textContent = "正在验证…";
  for (const project of projects) {
    try {
      const page = await decrypt(project, code);
      if (persist) {
        localStorage.setItem(lastProjectKey, project.id);
        localStorage.setItem(codeKey(project.id), code);
      }
      document.open();
      document.write(page + switcherHtml);
      document.close();
      return;
    } catch { /* try the next project */ }
  }
  status.textContent = "行程码不正确，请重试。";
  button.disabled = false;
  button.textContent = "打开旅行规划";
  document.getElementById("code").select();
}
document.getElementById("gate").addEventListener("submit", (event) => {
  event.preventDefault();
  openProject(document.getElementById("code").value, true);
});
const switchMode = new URLSearchParams(location.search).has("switch");
if (!switchMode) {
  const lastProject = projects.find((project) => project.id === localStorage.getItem(lastProjectKey));
  const rememberedCode = lastProject && localStorage.getItem(codeKey(lastProject.id));
  if (rememberedCode) {
    document.getElementById("status").textContent = "正在打开上次行程…";
    openProject(rememberedCode, false);
  }
}
</script></body></html>
