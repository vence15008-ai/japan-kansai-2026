VlEXC13wY6zbcEJa0=\",\"iterations\":250000}}];\n  const lastProjectKey = \"travel-last-project\";\n  const codeKey = (id) => \"travel-access-code:\" + id;\n  const from64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));\n  async function decrypt(project, code) {\n    const baseKey = await crypto.subtle.importKey(\"raw\", new TextEncoder().encode(code), \"PBKDF2\", false, [\"deriveKey\"]);\n    const key = await crypto.subtle.deriveKey({ name: \"PBKDF2\", salt: from64(project.payload.salt), iterations: project.payload.iterations, hash: \"SHA-256\" }, baseKey, { name: \"AES-GCM\", length: 256 }, false, [\"decrypt\"]);\n    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: \"AES-GCM\", iv: from64(project.payload.iv) }, key, from64(project.payload.data)));\n  }\n  const form = document.querySelector(\"#travel-project-switch form\");\n  form.addEventListener(\"submit\", async (event) => {\n    event.preventDefault();\n    const input = form.querySelector(\"input\");\n    const error = document.querySelector(\"#travel-project-switch .error\");\n    error.textContent = \"\";\n    for (const project of projects) {\n      try {\n        await decrypt(project, input.value);\n        localStorage.setItem(lastProjectKey, project.id);\n        localStorage.setItem(codeKey(project.id), input.value);\n        window.location.reload();\n        return;\n      } catch { /* try the next project */ }\n    }\n    error.textContent = \"行程码不正确，请重试。\";\n    input.select();\n  });\n})();\n<\/script>";
const lastProjectKey = "travel-last-project";
const codeKey = (id) => "travel-access-code:" + id;
const from64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
async function decrypt(project, code) {
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: from64(project.payload.salt), iterations: project.payload.iterations, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: from64(project.payload.iv) }, key, from64(project.payload.data)));
}
async function openProject(code, persist) {
  const button = document.getElementById("submit");
  const status = document.getElementById("status");
  status.textContent = "";
  button.disabled = true;
  button.textContent = "正在验证…";
  for (const project of projects) {
    try {
      const page = await decrypt(project, code);
      if (persist) {
        localStorage.setItem(lastProjectKey, project.id);
        localStorage.setItem(codeKey(project.id), code);
      }
      document.open();
      document.write(page + switcherHtml);
      document.close();
      return;
    } catch { /* try the next project */ }
  }
  status.textContent = "行程码不正确，请重试。";
  button.disabled = false;
  button.textContent = "打开旅行规划";
  document.getElementById("code").select();
}
document.getElementById("gate").addEventListener("submit", (event) => {
  event.preventDefault();
  openProject(document.getElementById("code").value, true);
});
const lastId = localStorage.getItem(lastProjectKey);
const lastCode = lastId && localStorage.getItem(codeKey(lastId));
if (lastCode) openProject(lastCode, false);
