  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: from64(project.payload.salt), iterations: project.payload.iterations, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: from64(project.payload.iv) }, key, from64(project.payload.data)));
}
async function openProject(code, persist) {
  const button = document.getElementById("submit");
  const status = document.getElementById("status");
  status.textContent = "";
  button.disabled = true;
  button.textContent = "正在验证…";
  for (const project of projects) {
    try {
      const page = await decrypt(project, code);
      if (persist) {
        localStorage.setItem(lastProjectKey, project.id);
        localStorage.setItem(codeKey(project.id), code);
      }
      document.open();
      document.write(page + switcherHtml);
      document.close();
      return;
    } catch { /* try the next project */ }
  }
  status.textContent = "行程码不正确，请重试。";
  button.disabled = false;
  button.textContent = "打开旅行规划";
  document.getElementById("code").select();
}
document.getElementById("gate").addEventListener("submit", (event) => {
  event.preventDefault();
  openProject(document.getElementById("code").value, true);
});
const lastId = new URLSearchParams(location.search).has("switch") ? null : localStorage.getItem(lastProjectKey);
const lastCode = lastId && localStorage.getItem(codeKey(lastId));
if (lastCode) openProject(lastCode, false);
