    function photoGuides(u){const refs=arr(u.photo_guides);return refs.length?`<div class="photo-guide-list">${refs.map(r=>`<article class="photo-guide-card"><div class="guide-feed-meta">${esc(r.platform||'拍照攻略')} · ${esc(r.author||'作者未知')} · 核验 ${esc(r.checked_at||'日期未知')}</div><h4>${esc(r.title||'现场拍照参考')}</h4><p>${esc(r.summary||'用于提前认识机位、光线和动作；实际以现场规定和人流为准。')}</p>${arr(r.tips).length?`<div class="photo-guide-tags">${arr(r.tips).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}<p class="muted">${esc(r.evidence||'体验参考，不替代景区官方规则。')}</p><a href="${esc(safe(r.url))}" target="_blank" rel="noopener">打开拍照攻略 ↗</a></article>`).join('')}</div>`:'<p class="muted">这个节点暂未找到足够可靠的拍照攻略，先用上方现场执行卡。</p>'}
    const baseOpenDrawer=openDrawer;openDrawer=(html)=>baseOpenDrawer(html.replace('图文攻略 Feed · 体验证据','十六番图文入口').replace('帖子内容用于判断实际体验；开放、预约与票价仍以“必要事实”和来源页为准。','点击原帖链接；是否由十六番 App 打开取决于该 App 的链接支持和当前设备。'));
    $('.drawer-close').addEventListener('click',closeDrawer);$('.backdrop').addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
    const backToTop=$('#back-to-top'),syncBackToTop=()=>backToTop.classList.toggle('visible',window.scrollY>420);window.addEventListener('scroll',syncBackToTop,{passive:true});syncBackToTop();backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  })();
  </script>
</body>
</html>
