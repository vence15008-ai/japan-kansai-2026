55｜换乘、午餐与花园露台休息\n- 在M01等1系統；计划约13:20乘车、13:31到花园露台R07。该线路班距约20–40分钟，错过要等下一班，实际以站牌为准。\n- 13:30后先找座位和厕所，再坐下吃午餐；若餐厅排队，便利店简餐替代即可。\n- 15:00–16:45作为留白休息时段：喝水、坐着看景，不再加植物园或收费展馆。16:55前后回R07站牌候车。\n\n#### 17:05–18:30｜到天览台看日落与夜景\n- 9/19–11/29班表列约17:05从花园露台发车、17:15到六甲缆车山上站的1系統。这个末段接驳是A方案关键，提前到站牌。\n- 从山上站步行至天览台；神户9/25日落约17:53。先看暮色，再等城市灯光逐渐亮起；如果雾云挡景，不要久等。\n\n#### 18:30以后｜六甲缆车下山、回酒店\n- 看完夜景回六甲缆车山上站，搭林间斜坡缆车下山；车程约10分钟，约20分钟一班，官方时刻末班参考21:10。切勿夜间徒步下山。\n- 到缆车下站后按实时导航搭市巴士回三宫，疲劳时短程打车；晚餐只是可选项，累了直接回酒店。\n\n### 有马温泉备选（与方案 A 互斥）\n如果不等天览台夜景、也不乘六甲缆车下山，可在花园露台改乘六甲有马索道前往有马，温泉街与公共汤择一后另按班次返神户。选择有马就放弃A方案夜景和六甲缆车下山；有马不是本日主线。\n\n### 执行优先级\n1. 先保11:30的M10→牧场巴士和12:30的返向2系統。\n2. 延误先删天上寺、缩短牧场/花园露台停留；不要把有马塞回主线。\n3. 想保百万夜景，必须赶上约17:05花园露台→六甲缆车山上站班次；班次或天气变动时以现场公告为准。"},{"id":"maya-viewline","name":"摩耶缆车＋索道","city":"神户 · 摩耶山","status":"must","tagline":"分两段乘上山；把换乘和等车时间也算进来","images":[],"why":"这是当天上山的核心交通体验，也是到掬星台的唯一计划路线；按首班运行，给11:30摩耶山上巴士留时间。","experience":"09:45前后到摩耶缆车站，10:00乘缆车至虹之站，换乘10:10左右索道至星之站；全程约15–25分钟，之后步行到掬星台。","practical":{"hours":"9月周五参考：缆车10:00首班，索道10:10首班；周二休业，风雨可能停运","price":"摩耶缆车与索道成人单程合计JPY900；是否纳入套票以当日票券范围为准","duration":"乘行约15–25分钟，不含排队与换乘等待","walking":"站内换乘与车站至掬星台短距离步行；有坡度","booking":"无需预约；现场购票，行前看官方运营状态","best_window":"9月周五10:00首班；最晚约11:20回M10站牌候车"},"scores":{"fit":4.6,"depth":3.7,"commercialisation":2.5,"effort":2.7,"flexibility":2.5},"pros":["两段山间交通体验明确","可与掬星台同一动线完成"],"watchouts":["风力或设备检查可能临时停运","如果09:20公交或首班接驳错过，优先确认能否赶上11:30的2系統"],"source_ids":["s_maya_hours","s_kobe_bus_18_2026"],"experience_markdown":"#### 上山时按这个顺序\n- 09:00离酒店，赶三宫站前09:20的18路；目标09:45前到摩耶缆车下站。\n- 10:00乘缆车到虹之站，下车跟指示换乘索道；索道约10:10发车。两段全程约15–25分钟，排队另计。\n- 到星之站后先确认11:30从M10发出的2系統站牌位置，再去掬星台；不要先绕去较远处。\n- 天上寺只在能于11:20前回M10时短访；否则略过，保住牧场接驳。"},{"id":"kikuseidai","name":"掬星台","city":"神户 · 摩耶山","status":"must","tagline":"用短停看港湾全景，不把观景台变成赶点任务","images":[],"why":"它是摩耶索道山顶站旁最顺路的观景点；早段短停能留住风景体验，也不牺牲六甲山牧场接驳。","experience":"先确认视野和云雾，再沿观景平台慢看神户港与大阪湾；留20–30分钟，天上寺是可删的附加段。","practical":{"hours":"露天观景区；乘摩耶Viewline抵达，运行时段以当日班表为准","price":"观景台本身免费；摩耶缆车/索道另付费或使用适用票券","duration":"约20–30分钟","walking":"从索道星之站步行可达；露天平台可能有风","booking":"无需预约","best_window":"本方案上午到访；11:20前回M10站牌"},"scores":{"fit":4.4,"depth":3.8,"commercialisation":2.4,"effort":2.1,"flexibility":2.4},"pros":["近索道上站，不需额外交通","海湾视野与神户港景观有辨识度"],"watchouts":["云雾会显著影响远景","露天停留注意风与体感温度","天上寺需往返步行并受11:30巴士约束"],"source_ids":["s_maya_hours","s_rokko_jnto"],"experience_markdown":"#### 到观景台后这样看\n- 先在平台停一下看云层；如果大阪湾方向被雾盖住，别长时间等天气变化。\n- 沿栏杆慢走一圈，分别看神户港和大阪湾；拍照后留几分钟不拍摄，观察船只、海岸线和城市层次。\n- 按20–30分钟控制停留。想去天上寺，先估往返步行；只要可能影响11:20回M10，就不去。\n- 离开前确认M10站牌和方向，至少提前10分钟到站。"},{"id":"rokko-farm","name":"六甲山牧场","city":"神户 · 六甲山","status":"must","tagline":"本日必去，但这版是45分钟入口周边快览","images":[],"why":"牧场是你们明确要求保留的体验；把游览压成短线，才能接上12:41返程巴士和下午的花园露台。","experience":"约11:44到牧场，先看入口附近羊群草地和动物，再按剩余时间买牛奶或冰淇淋；12:35前回M06站牌。","practical":{"hours":"官方通常9:00–17:00；最终以牧场当天公告为准","price":"成人参考JPY600；现场确认当日票价/活动","duration":"本方案约45分钟快览，不是完整园区游玩","walking":"园区起伏；短线控制活动范围，不建议赶着走全园","booking":"一般入园无需预约；个别体验以官方公告为准","best_window":"约11:44抵达；12:41返向巴士经牧场，需提前回站"},"scores":{"fit":4.7,"depth":4.0,"commercialisation":2.2,"effort":3.3,"flexibility":2.0},"pros":["动物与高原牧场氛围不同于市区景点","符合本次必去要求"],"watchouts":["45分钟只能做快览","地面可能泥泞或有动物气味","务必遵守饲养区规则并在互动后洗手"],"source_ids":["s_rokko_farm_2026","s_rokkobus2_2026","s_rokko_farm_events_2026"],"experience_markdown":"#### 45分钟快览路线\n- 11:44左右下车后先记住M06站牌的位置，核对12:41返向车；不要走到园区深处。\n- 先看入口周边草地与羊群，沿开放通道观察动物，给主体验约25–30分钟。是否能近距离互动，以现场围栏和工作人员指示为准。\n- 若队伍短，剩余时间买瓶牧场牛奶或软冰淇淋；不要排长队。\n- 12:30左右开始往M06回走，最晚12:35到站。互动后洗手；若下雨、湿滑或动物休息，就缩短拍照并提前候车。"},{"id":"rokko-garden-terrace","name":"六甲花园露台","city":"神户 · 六甲山","status":"recommended","tagline":"午餐、补水、坐下恢复；不在这里追加远距离景点","images":[],"why":"它是牧场后最适合安排午餐和体力恢复的节点，也是接往天览台夜景前的缓冲区。","experience":"约13:31到R07，先确认17:05返回R01的班车和室内休息位置，再吃午餐、自由看景并休息；16:50前去站牌。","practical":{"hours":"露台区域与餐饮/设施各有营业时间；逐店当天核对","price":"公共区域可散步；餐饮按店铺菜单，通常人均¥50–150预算","duration":"约3小时20分钟，包含用餐与休息","walking":"区域内少量步行；以坐下休息为主","booking":"公共区域无需预约；餐饮依现场排队","best_window":"午餐后保留约105分钟休息；16:50到R07站     if(/^#[0-9a-f]{6}$/i.test(d.presentation?.accent||''))document.documentElement.style.setProperty('--accent',d.presentation.accent);document.title=meta.title||'旅行规划';

    function foodCards(fs,travelTime=''){return arr(fs).map((f,i)=>{const travel=travelTime||f.travel_time||'';const travelLabel=/^约/.test(travel)?travel:`约 ${travel}`;return `<div class="media-card"><div><span class="badge ${i===0?'good':''}">${i===0?'首选':`备选 ${i}`}</span> <span class="badge">特色 · ${esc(f.specialty||f.kind||'餐饮')}</span></div><h3>${esc(f.name)}</h3><p><strong>${esc(f.price||'价格待核验')}</strong> · ${esc(f.rating||'评分待核验')}</p>${travel?`<p><strong>过去所需：</strong>从上一节点${esc(travelLabel)}</p>`:''}${f.review_signal?`<p><strong>评价：</strong>${esc(f.review_signal)}</p>`:''}${f.recommended_dishes?`<p><strong>推荐菜：</strong>${esc(Array.isArray(f.recommended_dishes)?f.recommended_dishes.join('、'):f.recommended_dishes)}</p>`:''}<p><strong>顺路判断：</strong>${esc(f.route_fit||f.why||f.note||'待核对')}</p>${f.reservation?`<p><strong>预约：</strong>${esc(f.reservation)}</p>`:''}${f.hours?`<p><strong>营业：</strong>${esc(f.hours)}</p>`:''}${f.note?`<p class="muted">${esc(f.note)}</p>`:''}${f.map_url?`<a href="${esc(safe(f.map_url))}" target="_blank" rel="noopener">打开地图 ↗</a>`:''}${f.source_ids?.length?`<p class="muted">来源：${sourceLinks(f.source_ids)}</p>`:''}</div>`}).join('')||'<p class="muted">暂无备选</p>'}

    function openEvent(it){const foods=it.food_options||((it.food_name)?[{name:it.food_name,price:it.food_price,why:it.note}]:[]),t=it.transport_detail;if(it.type==='transport')return openDrawer(`<div class="drawer-body"><div class="eyebrow">交通节点</div><h2 id="drawer-title">${esc(eventTitle(it))}</h2>${transportCard(t)}<section class="drawer-section"><h3>乘车提示</h3><p>${esc(t?.instructions||it.note||'按地图实时结果选择班次。')}</p>${t?.checked_at?`<p class="muted">核验 ${esc(t.checked_at)} · ${sourceLinks(t.source_ids)}</p>`:''}</section></div>`);if(it.type==='rest'||it.type==='free')return openDrawer(`<div class="drawer-body"><div class="eyebrow">休息与缓冲</div><h2 id="drawer-title">${esc(eventTitle(it))}</h2><section class="drawer-section"><h3>这段时间的作用</h3><p>${esc(it.note||it.role||'恢复体力并吸收前后交通波动。')}</p><p><strong>预留：</strong>${esc(it.duration||'时长待定')}</p></section></div>`);openDrawer(`<div class="drawer-body"><div class="eyebrow">${esc(typeLabel[it.type]||'安排')}</div><h2 id="drawer-title">${esc(eventTitle(it))}</h2><p>${esc(it.note||'')}</p><section class="drawer-section"><h3>用餐备选</h3>${foodCards(foods)}</section>${it.transfer||it.transport||it.map_url?`<section class="drawer-section"><h3>下一段交通</h3>${renderTransfer(it.transfer||{mode:it.transport,duration:it.duration,map_url:it.map_url})}</section>`:''}</div>`)}
    function guideFeed(u){const cover=arr(u.images)[0]||{},card=(title,summary,tips)=>({platform:'行程攻略卡',title,author:'本次行程',published_at:meta.updated_at||'近期',image_url:cover.url,image_alt:cover.alt,summary,tips,commercial_status:'非商业内容'}),planner=[card('先用这条主线进入',u.experience||u.why||'先按当天时间线抵达，再根据现场状态调整。',['到达后先看人流','不追求一次走完','保留下一段缓冲']),card('把时间花在真正值得的部分',u.why||'推荐理由待补。',[u.practical?.duration?`建议停留：${factValue(u.practical.duration)}`:'停留时间待现场调整',u.practical?.best_window?`适合时段：${factValue(u.practical.best_window)}`:'错峰比打卡数量重要','不要为拍照折返']),card('到现场后这样走',`先完成“${u.tagline||u.name}”的主体验；状态好再加第二段，避免把可选项做成必达。`,['先找入口／洗手间／休息位','主体验优先','第二段按体力决定']),card('这些细节比景点数更重要',arr(u.watchouts).length?u.watchouts.join('；'):'营业、预约和天气在出发前仍需复核；现场以安全和舒适度为先。',[u.practical?.booking?`预约：${factValue(u.practical.booking)}`:'预约规则待复核',u.practical?.walking?`步行：${factValue(u.practical.walking)}`:'按实际体力缩短','不把社交帖当运营事实']),card('留一个可随时放弃的版本','如果天气、人流、交通或体力不如预期，只保留最想体验的一件事，之后直接进入下一段或就近休息。',['下雨：优先室内或缩短','人多：停留后错峰离开','累了：先坐下再决定'])],creator=[...arr(u.guide_feed),...arr(u.media_refs).map(r=>Object.assign({},r,{summary:r.signal,image_url:r.image_url||cover.url,image_alt:r.image_alt||cover.alt,tips:[r.platform||'攻略',r.travel_season?`旅行季节：${r.travel_season}`:'旅行季节未知']}))],raw=[...planner,...creator];return `<div class="guide-feed">${raw.map(r=>`<article class="guide-feed-card"><div class="guide-feed-cover">${r.image_url?`<img src="${esc(safe(r.image_url))}" alt="${esc(r.image_alt||r.title||u.name)}" loading="lazy" onerror="this.parentElement.textContent='图片加载失败'">`:'攻略图待补'}</div><div class="guide-feed-copy"><div class="guide-feed-meta">${esc(r.platform||'攻略')} · ${esc(r.author||'作者未知')} · ${esc(r.published_at||'日期未知')}</div><h4>${esc(r.title||'行前参考')}</h4><p>${esc(r.summary||r.signal||'内容摘要待补')}</p>${arr(r.tips).length?`<div class="guide-feed-tags">${arr(r.tips).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}${r.commercial_status?`<p class="guide-feed-meta">合作标记：${esc(r.commercial_status)}</p>`     function guideFeed(u){const refs=arr(u.guide_feed).filter(r=>r.platform==='十六番'&&r.url);return refs.length?`<div class="guide-links">${refs.map(r=>`<article class="media-card"><div class="guide-feed-meta">十六番 · ${esc(r.author||'作者未知')} · ${esc(r.published_at||'日期未知')}</div><h3>${esc(r.title||'相关图文帖')}</h3><p>${esc(r.summary||'点击查看原始图文内容。')}</p><a href="${esc(safe(r.url))}" target="_blank" rel="noopener">打开十六番原帖 ↗</a></article>`).join('')}</div>`:'<p class="muted">暂未收录可直达的十六番原帖。</p>'}

  <script>
    (()=>{const data=window.TRAVEL_DATA||{};function addInline(parent,text){const re=/\*\*(.+?)\*\*/g;let last=0,m;while((m=re.exec(text))){if(m.index>last)parent.append(document.createTextNode(text.slice(last,m.index)));const strong=document.createElement('strong');strong.textContent=m[1];parent.append(strong);last=re.lastIndex}if(last<text.length)parent.append(document.createTextNode(text.slice(last)))}function addSchedule(){const id=this.dataset.unit,u=(data.attraction_units||[]).find(x=>x.id===id);if(!u?.experience_markdown)return;setTimeout(()=>{const body=document.querySelector('#drawer-content .drawer-body');if(!body)return;body.querySelector('.experience-timetable')?.remove();const section=document.createElement('section');section.className='drawer-section experience-timetable';const title=document.createElement('h3');title.textContent='景点内分时玩法';section.append(title);if(u.experience_warning){const alert=document.createElement('div');alert.className='experience-alert';alert.textContent=u.experience_warning;section.append(alert)}const box=document.createElement('div');box.className='experience-markdown';let list=null;for(const raw of u.experience_markdown.split('\n')){const line=raw.trim();if(!line){list=null;continue}if(line.startsWith('### ')){list=null;const h=document.createElement('h4');h.textContent=line.slice(4);box.append(h)}else if(line.startsWith('- ')){if(!list){list=document.createElement('ul');box.append(list)}const li=document.createElement('li');addInline(li,line.slice(2));list.append(li)}else{list=null;const p=document.createElement('p');addInline(p,line);box.append(p)}}section.append(box);const overview=[...body.querySelectorAll('.drawer-section')].find(x=>x.querySelector('h3')?.textContent==='游玩攻略概览');if(overview)overview.after(section);else body.append(section)},0)}document.addEventListener('click',e=>{const trigger=e.target.closest('[data-unit]');if(trigger)addSchedule.call(trigger)})})();
  </script>
  <script>
    (()=>{const data=window.TRAVEL_DATA||{};function renderDailyExpense(){const active=document.querySelector('.day-picker button.active'),hero=document.querySelector('#day-stage .day-hero');if(!active||!hero)return;const day=active.dataset.day,info=data.daily_expenses?.[String(day)];document.querySelector('#day-stage .daily-expense')?.remove();if(!info)return;const card=document.createElement('section');card.className='daily-expense';card.setAttribute('aria-label','当天花费估算');const heading=document.createElement('div');heading.className='expense-heading';const label=document.createElement('div');label.innerHTML='<div class="eyebrow">Daily cost estimate</div><h3>当天花费估算</h3>';const total=document.createElement('div');total.className='expense-total';total.textContent=info.total||'待估';const totalNote=document.createElement('small');totalNote.textContent=info.total_note||'不含购物、机票与住宿';total.append(totalNote);heading.append(label,total);card.append(heading);const grid=document.createElement('div');grid.className='expense-grid';for(const item of (info.categories||[])){const cell=document.createElement('div');cell.className='expense-cell';const name=document.createElement('span');name.textContent=item.name||'其他';const amount=document.createElement('strong');amount.textContent=item.estimate||'待估';cell.append(name,amount);grid.append(cell)}card.append(grid);const note=document.createElement('p');note.className='expense-note';note.textContent=info.note||'估算值，按实际消费与当日路线为准。';card.append(note);hero.after(card)}document.addEventListener('click',e=>{if(e.target.closest('.day-picker [data-day]'))window.setTimeout(renderDailyExpense,0)});renderDailyExpense()})();
